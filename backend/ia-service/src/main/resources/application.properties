# =====================================================
# Application Document Service
# =====================================================
spring.application.name=ia-service
server.port=8085
# =====================================================
# Base PostgreSQL & PGVector
# =====================================================
spring.datasource.url=jdbc:postgresql://localhost:5432/db_stn_ia
spring.datasource.username=postgres
spring.datasource.password=passer
spring.jpa.hibernate.ddl-auto=update

# =====================================================
# Keycloak Security JWT
# =====================================================
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8080/realms/lab-stn-realm

# =====================================================
# MinIO Client
# =====================================================
minio.url=http://localhost:9000
minio.access-key=minioadmin
minio.secret-key=minioadmin
minio.bucket-name=labo-stn-livrables

# =====================================================
# Paramètres LLM & Embeddings (OpenAI ou Fallback Local ESMT)
# =====================================================
app.ai.llm.provider=openai
app.ai.llm.api-key=${OPEANAI_API_KEY:demo-key-stn}
app.ai.chunk.size=800
app.ai.chunk.overlap=150
app.ai.embedding.dimension=1536
