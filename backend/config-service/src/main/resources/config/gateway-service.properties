spring.application.name=gateway-service
server.port=8765

# =====================================================
# EUREKA
# =====================================================

eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.registry-fetch-interval-seconds=3
eureka.instance.prefer-ip-address=true

# =====================================================
# ROUTAGE DYNAMIQUE EUREKA
# =====================================================

spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true

# =====================================================
# RESILIENCE4J - TIME LIMITER
# =====================================================

resilience4j.timelimiter.configs.default.timeout-duration=15s

resilience4j.timelimiter.instances.userServiceCircuitBreaker.timeout-duration=15s
resilience4j.timelimiter.instances.thesisServiceCircuitBreaker.timeout-duration=15s
resilience4j.timelimiter.instances.documentServiceCircuitBreaker.timeout-duration=15s
resilience4j.timelimiter.instances.evaluationServiceCircuitBreaker.timeout-duration=15s
resilience4j.timelimiter.instances.aiServiceCircuitBreaker.timeout-duration=30s

# =====================================================
# RESILIENCE4J - CONFIGURATION GENERALE
# =====================================================

resilience4j.circuitbreaker.configs.default.sliding-window-size=20

# Il faut plusieurs appels avant d'�valuer le taux d'�chec
resilience4j.circuitbreaker.configs.default.minimum-number-of-calls=10

# Le circuit ne s'ouvre que si la majorit� des appels �chouent
resilience4j.circuitbreaker.configs.default.failure-rate-threshold=80

# Temps pendant lequel le circuit reste ouvert
resilience4j.circuitbreaker.configs.default.wait-duration-in-open-state=5s

# =====================================================
# USER SERVICE
# =====================================================

resilience4j.circuitbreaker.instances.userServiceCircuitBreaker.base-config=default

# =====================================================
# THESIS SERVICE
# =====================================================

resilience4j.circuitbreaker.instances.thesisServiceCircuitBreaker.base-config=default

# =====================================================
# DOCUMENT SERVICE
# =====================================================

resilience4j.circuitbreaker.instances.documentServiceCircuitBreaker.base-config=default

# =====================================================
# EVALUATION SERVICE
# =====================================================

resilience4j.circuitbreaker.instances.evaluationServiceCircuitBreaker.base-config=default

# =====================================================
# AI SERVICE
# =====================================================

resilience4j.circuitbreaker.instances.aiServiceCircuitBreaker.base-config=default

# =====================================================
# ACTUATOR
# =====================================================

management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
