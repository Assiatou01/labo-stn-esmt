# ============================================================
# C5 — Configuration centralisee : thesis-service
# Fichier servi par config-service via classpath:/config/
# ============================================================
spring.datasource.url=jdbc:postgresql://localhost:5432/lab_stn_thesis
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# RabbitMQ
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=${RABBITMQ_PASSWORD}

# JWT Security — Remplacer par l'URL Keycloak reelle
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8080/realms/lab-stn-realm

# Feign
feign.client.config.default.connect-timeout=5000
feign.client.config.default.read-timeout=10000
