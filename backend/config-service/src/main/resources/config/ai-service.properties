# =====================================================
# Application IA (ai-service)
# =====================================================
server.port=8085
spring.application.name=ai-service

# PostgreSQL & PGVector
spring.datasource.url=jdbc:postgresql://localhost:5432/lab_stn_ai
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.connection-init-sql=CREATE EXTENSION IF NOT EXISTS vector

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Keycloak
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8080/realms/lab-stn-realm

# MinIO
minio.endpoint=http://localhost:9000
minio.url=http://localhost:9000
minio.access-key=minioadmin
minio.secret-key=minioadmin
minio.bucket-name=${STN_DOCUMENTS_BUCKET:stn-documents}

# Moteur IA & LLM (Corrig? vers api.openai.com/v1)
app.ai.llm.provider=local
app.ai.llm.api-key=${OPENAI_API_KEY:demo-key-stn}
app.ai.llm.model=gpt-3.5-turbo
app.ai.llm.base-url=https://api.openai.com/v1
app.ai.llm.temperature=0.3
app.ai.llm.max-tokens=1000

app.ai.chunk.size=800
app.ai.chunk.overlap=150
app.ai.embedding.dimension=1536

ia.embedding.similarity-threshold=0.4
ia.embedding.max-results=5

# Feign vers document-service
feign.client.config.default.connect-timeout=5000
feign.client.config.default.read-timeout=30000

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.hostname=localhost
eureka.instance.prefer-ip-address=true

# RabbitMQ
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD}

# Tracabilit Zipkin & Actuator
management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=http://localhost:9411/api/v2/spans

# Swagger / OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
