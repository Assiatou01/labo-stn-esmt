<aside class="w-full md:w-72 bg-slate-900/90 border-r border-slate-800/80 flex flex-col justify-between shrink-0 p-5 backdrop-blur-xl z-20 min-h-screen">
  <div>
    <!-- Logo Officiel ESMT -->
    <div class="flex items-center gap-3 px-2 py-2 mb-6 bg-slate-950/60 p-2.5 rounded-2xl border border-slate-800/80 shadow-md">
      <div class="w-12 h-12 rounded-xl bg-white p-1 flex items-center justify-center shadow-lg shrink-0 overflow-hidden border border-slate-700">
        <img src="assets/logo-esmt.png" alt="Logo ESMT" class="w-full h-full object-contain" />
      </div>
      <div class="min-w-0">
        <h1 class="font-black text-white tracking-tight text-sm leading-tight uppercase flex items-center gap-1">
          <span>STN</span>
          <span class="text-[#00A3E0] font-extrabold">ResearchHub</span>
        </h1>
        <p class="text-[10px] text-[#84BD00] font-semibold truncate">ESMT Dakar • Lab STN</p>
      </div>
    </div>

    <!-- Liens dynamiques de navigation -->
    <nav class="space-y-1.5">
      <a *ngFor="let item of navItems" 
         [routerLink]="item.path" 
         routerLinkActive="bg-[#002B49] text-[#00A3E0] border border-[#00A3E0]/30 shadow-md"
         [routerLinkActiveOptions]="{exact: false}"
         class="flex items-center gap-3 px-3.5 py-2.5 rounded-xl font-medium text-sm transition text-slate-400 hover:bg-slate-800/60 hover:text-slate-200">
        <span class="text-base">{{ item.icon }}</span>
        <span>{{ item.label }}</span>
      </a>
    </nav>
  </div>

  <div class="pt-4 border-t border-slate-800/80 text-xs text-slate-400 space-y-1">
    <div class="flex justify-between"><span>ESMT Dakar</span><span class="text-[#00A3E0]">Lab STN</span></div>
    <div class="text-[10px] text-center text-slate-500 mt-2">© 2026 ESMT • Tous droits réservés</div>
  </div>
</aside>
