<!-- Sidebar Officielle ESMT -->
<aside class="w-full md:w-64 bg-white border-r border-slate-200 flex flex-col justify-between shrink-0 p-4 shadow-sm z-20">
  <div>
    <!-- Logo & Marque ESMT Agrandie -->
    <div class="flex items-center gap-3.5 px-2 py-3 mb-5 border-b border-slate-100 bg-slate-50/70 rounded-2xl">
      <div class="w-16 h-16 rounded-2xl bg-white p-2 flex items-center justify-center shadow-md border border-slate-200 shrink-0 overflow-hidden hover:shadow-lg transition">
        <img src="assets/logo-esmt.png" alt="Logo ESMT" class="w-full h-full object-contain max-h-12" onerror="this.src='logo-esmt.png'" />
      </div>
      <div class="min-w-0">
        <h1 class="font-extrabold text-[#002B49] text-base leading-tight tracking-tight uppercase">
          STN <span class="text-[#00A3E0]">ResearchHub</span>
        </h1>
        <p class="text-xs text-[#84BD00] font-bold truncate mt-0.5">ESMT Dakar • Lab STN</p>
        <span class="text-[10px] text-slate-400 font-semibold uppercase tracking-wider block">Portail Recherche</span>
      </div>
    </div>

    <!-- Menu de Navigation Dynamique selon Rôle -->
    <nav class="space-y-1.5">
      <ng-container *ngFor="let item of menuItems">
        <a *ngIf="canAccess(item.roles)"
           [routerLink]="item.route"
           routerLinkActive="bg-[#002B49] text-white shadow-md"
           [routerLinkActiveOptions]="{ exact: item.route === '/dashboard' }"
           class="flex items-center gap-3 px-3.5 py-2.5 text-sm font-semibold rounded-xl text-slate-600 hover:text-slate-900 hover:bg-slate-100 transition-all">
          <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75" [attr.d]="item.icon"></path>
          </svg>
          <span>{{ item.label }}</span>
        </a>
      </ng-container>
    </nav>
  </div>

  <!-- Pied de page Sidebar -->
  <div class="pt-4 border-t border-slate-100 space-y-2 text-center text-xs text-slate-400">
    <div class="text-[11px] font-medium text-slate-500">
      Plateforme Doctorat & TRL
    </div>
    <div class="text-[10px] text-slate-400">
      &copy; 2026 ESMT Dakar — Laboratoire STN
    </div>
  </div>
</aside>
