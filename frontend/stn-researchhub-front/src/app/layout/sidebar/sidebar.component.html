<nav class="space-y-1 px-3 py-4">
  <ng-container *ngFor="let item of menuItems">
    <a *ngIf="canAccess(item.roles)"
       [routerLink]="item.route"
       routerLinkActive="bg-[#002B49] text-white shadow-sm"
       [routerLinkActiveOptions]="{ exact: item.route === '/dashboard' }"
       class="flex items-center gap-3 px-3.5 py-2.5 text-sm font-medium rounded-xl text-slate-600 hover:text-slate-900 hover:bg-slate-100 transition-all duration-150">
      <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75" [attr.d]="item.icon"></path>
      </svg>
      <span>{{ item.label }}</span>
    </a>
  </ng-container>
</nav>
