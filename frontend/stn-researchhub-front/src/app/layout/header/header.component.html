<header class="h-16 border-b border-slate-200 bg-white px-6 flex items-center justify-between sticky top-0 z-10 shadow-sm">

  <!-- Informations portail -->
  <div class="flex items-center gap-2.5 text-xs text-slate-600">
    <span class="w-2.5 h-2.5 rounded-full bg-[#84BD00] animate-pulse"></span>

    <span class="font-bold text-[#002B49]">
      Portail Scientifique & TRL
    </span>

    <span class="text-slate-300">|</span>

    <span class="text-slate-500 font-medium hidden sm:inline">
      École Supérieure Multinationale des Télécommunications
    </span>
  </div>

  <!-- Utilisateur connecté -->
  <div class="flex items-center gap-3">

    <!-- Avatar -->
    <div
      class="w-8 h-8 rounded-lg bg-[#002B49] text-white flex items-center justify-center text-sm shadow-sm font-bold">
      {{ currentUser.avatar || '👨‍🔬' }}
    </div>

    <!-- Informations utilisateur -->
    <div class="hidden sm:block text-left">
      <div class="text-xs font-bold text-[#002B49]">
        {{ currentUser.prenom }} {{ currentUser.nom }}
      </div>

      <div class="text-[10px] text-[#00A3E0] font-bold">
        {{ currentUser.roleLabel }}
      </div>
    </div>

    <!-- Bouton Déconnexion -->
    <button
      type="button"
      (click)="logout()"
      title="Se déconnecter"
      class="ml-2 px-3 py-2 text-xs font-bold text-red-600 border border-red-200 rounded-lg hover:bg-red-50 hover:border-red-300 transition flex items-center gap-2">

      <svg
        class="w-4 h-4"
        fill="none"
        stroke="currentColor"
        viewBox="0 0 24 24">

        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3V7a3 3 0 013-3h4a3 3 0 013 3v1">
        </path>

      </svg>

      <span class="hidden sm:inline">
        Déconnexion
      </span>
    </button>

  </div>
</header>
