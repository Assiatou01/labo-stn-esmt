<header class="h-16 border-b border-slate-200 bg-white px-6 flex items-center justify-between sticky top-0 z-10 shadow-sm">
  <div class="flex items-center gap-2.5 text-xs text-slate-600">
    <span class="w-2.5 h-2.5 rounded-full bg-[#84BD00] animate-pulse"></span>
    <span class="font-bold text-[#002B49]">Portail Scientifique & TRL</span>
    <span class="text-slate-300">|</span>
    <span class="text-slate-500 font-medium hidden sm:inline">École Supérieure Multinationale des Télécommunications</span>
  </div>

  <div class="flex items-center gap-4">
    <!-- Switcher de Rôle (Simulation Démo) -->
    <div class="flex items-center gap-2">
      <label class="text-xs text-slate-500 font-bold hidden sm:inline">Profil Acteur :</label>
      <select [value]="currentUser.role" (change)="onRoleChange($event)" class="px-3 py-1.5 rounded-lg text-xs bg-slate-50 text-slate-800 border border-slate-300 font-bold cursor-pointer focus:outline-none focus:border-[#00A3E0]">
        <option value="ROLE_DOCTORANT">👨‍🎓 Doctorant Chercheur</option>
        <option value="ROLE_ENCADREUR">👨‍🏫 Directeur / Encadreur</option>
        <option value="ROLE_DIRECTEUR_RECHERCHE">🏛️ Directeur de la Recherche</option>
        <option value="ROLE_PARTENAIRE">🏢 Partenaire Industriel / TRL</option>
        <option value="ROLE_ADMIN">⚙️ Administrateur Système</option>
      </select>
    </div>

    <!-- Profil Connecté & Déconnexion Keycloak -->
    <div class="flex items-center gap-3 pl-3 border-l border-slate-200">
      <div class="w-8 h-8 rounded-lg bg-[#002B49] text-white flex items-center justify-center text-sm shadow-sm font-bold">
        {{ currentUser.avatar || '👤' }}
      </div>
      <div class="hidden sm:block text-left">
        <div class="text-xs font-bold text-[#002B49]">{{ currentUser.prenom }} {{ currentUser.nom }}</div>
        <div class="text-[10px] text-[#00A3E0] font-bold">{{ currentUser.roleLabel }} (ID #{{ currentUser.id }})</div>
      </div>
      <button (click)="logout()" title="Déconnexion Keycloak" class="p-1.5 text-slate-400 hover:text-red-600 hover:bg-red-50 rounded-lg transition text-xs font-bold flex items-center gap-1">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
      </button>
    </div>
  </div>
</header>
