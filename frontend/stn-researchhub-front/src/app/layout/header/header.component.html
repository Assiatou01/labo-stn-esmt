<header class="h-16 border-b border-slate-800/80 bg-slate-900/70 backdrop-blur-xl px-6 flex items-center justify-between sticky top-0 z-10">
  <div class="flex items-center gap-2.5 text-xs text-slate-400">
    <div class="w-2 h-2 rounded-full bg-[#84BD00] animate-pulse"></div>
    <span class="font-semibold text-slate-200">Portail Scientifique & TRL</span>
    <span class="text-slate-600">•</span>
    <span class="text-[#00A3E0] font-medium hidden sm:inline">École Supérieure Multinationale des Télécommunications</span>
  </div>

  <div class="flex items-center gap-4">
    <!-- Switcher de rôle pour tester les acteurs -->
    <div class="flex items-center gap-2">
      <label class="text-xs text-slate-400 hidden sm:inline">Profil Acteur :</label>
      <select [value]="currentUser.role" (change)="onRoleChange($event)" class="glass-input px-3 py-1.5 rounded-lg text-xs bg-slate-900 text-slate-200 border-slate-700 cursor-pointer font-medium">
        <option value="ROLE_DOCTORANT">👨‍🎓 Doctorant Chercheur</option>
        <option value="ROLE_ENCADREUR">👨‍🏫 Directeur / Encadreur</option>
        <option value="ROLE_DIRECTION">👩‍💼 Direction Laboratoire</option>
        <option value="ROLE_PARTENAIRE">🏢 Partenaire Industriel / TRL</option>
        <option value="ROLE_ADMIN">⚙️ Administrateur Système</option>
      </select>
    </div>

    <!-- Profil Connecté -->
    <div class="flex items-center gap-3 pl-3 border-l border-slate-800">
      <div class="w-8 h-8 rounded-lg bg-[#002B49] flex items-center justify-center text-sm border border-slate-700">
        {{ currentUser.avatar || '👤' }}
      </div>
      <div class="hidden sm:block text-left">
        <div class="text-xs font-bold text-white">{{ currentUser.prenom }} {{ currentUser.nom }}</div>
        <div class="text-[10px] text-[#00A3E0] font-medium">{{ currentUser.roleLabel }}</div>
      </div>
    </div>
  </div>
</header>
