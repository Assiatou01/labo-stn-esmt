<div class="min-h-screen w-full bg-gradient-to-br from-slate-100 via-blue-50/40 to-slate-100 flex items-center justify-center p-4 relative">
  <!-- Carte Centrale Élégante sur Fond Blanc -->
  <div class="bg-white w-full max-w-md rounded-3xl border border-slate-200/80 shadow-2xl p-8 space-y-6 relative z-10">
    
    <!-- En-tête Logo ESMT -->
    <div class="text-center space-y-3">
      <div class="w-24 h-24 mx-auto bg-white p-2 rounded-2xl shadow-md border border-slate-100 flex items-center justify-center">
        <img src="assets/logo-esmt.png" alt="Logo Officiel ESMT" class="w-full h-full object-contain" />
      </div>
      <div>
        <h1 class="text-2xl font-black text-[#002B49] tracking-tight">
          <span>STN </span><span class="text-[#00A3E0]">ResearchHub</span>
        </h1>
        <p class="text-xs font-bold text-[#84BD00] uppercase tracking-wide mt-0.5">École Supérieure Multinationale des Télécommunications</p>
        <p class="text-[11px] text-slate-500 mt-1 font-medium">Système de Gestion Doctorale & Évaluation TRL</p>
      </div>
    </div>

    <!-- Formulaire de Connexion -->
    <form (ngSubmit)="onLogin()" class="space-y-4">
      <div>
        <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Identifiant ou Email Institutionnel</label>
        <input type="text" [(ngModel)]="username" name="username" required class="w-full px-4 py-3 bg-slate-50 border border-slate-300 rounded-xl text-sm text-slate-800 focus:outline-none focus:border-[#00A3E0] focus:ring-2 focus:ring-[#00A3E0]/20 transition" placeholder="prenom.nom@esmt.sn" />
      </div>

      <div>
        <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Mot de Passe</label>
        <input type="password" [(ngModel)]="password" name="password" required class="w-full px-4 py-3 bg-slate-50 border border-slate-300 rounded-xl text-sm text-slate-800 focus:outline-none focus:border-[#00A3E0] focus:ring-2 focus:ring-[#00A3E0]/20 transition" placeholder="••••••••" />
      </div>

      <div>
        <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Profil & Rôle à tester</label>
        <select [(ngModel)]="selectedRole" name="role" class="w-full px-4 py-3 bg-slate-50 border border-slate-300 rounded-xl text-sm font-semibold text-slate-800 focus:outline-none focus:border-[#00A3E0] cursor-pointer">
          <option value="ROLE_DOCTORANT">👨‍🎓 Doctorant Chercheur</option>
          <option value="ROLE_ENCADREUR">👨‍🏫 Directeur de Thèse / Encadreur</option>
          <option value="ROLE_DIRECTEUR_RECHERCHE">👩‍💼 Directeur de la Recherche</option>
          <option value="ROLE_PARTENAIRE">🏢 Partenaire Industriel / Évaluateur TRL</option>
          <option value="ROLE_ADMIN">⚙️ Administrateur Système</option>
        </select>
      </div>

      <button type="submit" class="w-full py-3.5 bg-[#002B49] hover:bg-[#003c66] text-white font-bold text-sm rounded-xl shadow-lg shadow-[#002B49]/20 transition flex items-center justify-center gap-2">
        <span>Se Connecter (SSO Keycloak)</span>
        <svg class="w-4 h-4 text-[#00A3E0]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path>
        </svg>
      </button>
    </form>

    <!-- Pied de page -->
    <div class="pt-4 border-t border-slate-100 flex items-center justify-center gap-2 text-xs text-slate-400 font-medium">
      <span class="w-2 h-2 rounded-full bg-[#00A3E0]"></span>
      <span class="w-2 h-2 rounded-full bg-[#84BD00]"></span>
      <span class="w-2 h-2 rounded-full bg-[#FFC72C]"></span>
      <span>7 Pays Membres • ESMT Dakar © 2026</span>
    </div>

  </div>
</div>
