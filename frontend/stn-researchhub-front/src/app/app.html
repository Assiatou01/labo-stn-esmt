<!-- CAS 1 : Page de Connexion Plein Écran (Sans Sidebar ni Header) -->
<div *ngIf="isAuthPage" class="min-h-screen w-full">
  <router-outlet></router-outlet>
</div>

<!-- CAS 2 : Plateforme Connectéée (Design Lumineux, Professionnel & Harmonieux) -->
<div *ngIf="!isAuthPage" class="bg-slate-50 text-slate-800 min-h-screen flex flex-col md:flex-row antialiased">
  <!-- Sidebar -->
  <app-sidebar></app-sidebar>

  <!-- Contenu Principal -->
  <div class="flex-1 flex flex-col min-w-0">
    <app-header></app-header>
    <main class="flex-1 p-6 md:p-8 max-w-7xl w-full mx-auto">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
