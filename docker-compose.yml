services:
  # 1. Gestionnaire de messages asynchrones RabbitMQ
  rabbitmq:
    image: rabbitmq:3-management
    container_name: labstn-rabbitmq
    ports:
      - "5672:5672"     # Protocole AMQP pour Spring Boot
      - "15672:15672"   # Console web d'administration (guest / guest)
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    restart: unless-stopped

  # 2. Serveur de stockage d'objets S3 MinIO (Livrables et documents de recherche)
  minio:
    image: elestio/minio:latest
    container_name: labstn-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"     # API S3 MinIO
      - "9001:9001"     # Console Web MinIO
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
    volumes:
      - minio_data:/data
    restart: unless-stopped

  # 3. Système de traçabilité distribuée Zipkin
  zipkin:
    image: openzipkin/zipkin:latest
    container_name: labstn-zipkin
    ports:
      - "9411:9411"     # Console Web Zipkin et endpoint /api/v2/spans
    restart: unless-stopped

volumes:
  minio_data:
